name: Deploy to Azure App Service

# Every push to main builds the app and deploys it to Azure.
# It does nothing until the repository variable AZURE_WEBAPP_NAME is set.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install PHP packages (no dev tools)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Package the app
        run: zip -r -q release.zip . -x '.git/*' '.github/*' 'tests/*' 'postman/*'

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
